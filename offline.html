<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Protocolo XABCDE</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .offline-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #3498db;
        }

        p {
            margin: 10px 0;
            line-height: 1.5;
            color: #ecf0f1;
        }

        .retry-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .retry-button:hover {
            background-color: #2980b9;
        }

        .cached-data {
            margin-top: 30px;
            padding: 20px;
            background-color: #2c3e50;
            border-radius: 5px;
            max-width: 600px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="offline-icon">📡</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar ao servidor do Protocolo XABCDE.</p>
    <p>Mas não se preocupe! Você ainda pode:</p>
    <div class="cached-data">
        <p>✓ Ver protocolos salvos anteriormente</p>
        <p>✓ Criar novos protocolos (serão sincronizados quando voltar online)</p>
        <p>✓ Gerar relatórios</p>
    </div>
    <button class="retry-button" onclick="window.location.reload()">Tentar Novamente</button>

    <script>
        // Verifica periodicamente a conexão
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
