<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protocolo XABCDE - Avaliação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#viaAerea">
                                A - Via Aérea
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#respiracao">
                                B - Respiração
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#circulacao">
                                C - Circulação
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#neurologico">
                                D - Neurológico
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#exposicao">
                                E - Exposição
                            </a>
                        </li>
                    </ul>
                    <hr>
                    <button id="salvarAvaliacao" class="btn btn-primary w-100">
                        Salvar Avaliação
                    </button>
                </div>
            </div>

            <!-- Main content -->
            <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Avaliação XABCDE</h1>
                    <div id="pacienteInfo"></div>
                </div>

                <!-- Via Aérea -->
                <section id="viaAerea" class="mb-4">
                    <h3>A - Via Aérea</h3>
                    <div class="card">
                        <div class="card-body">
                            <div id="viaAereaChecklist"></div>
                            <div class="mt-3">
                                <label class="form-label">Notas:</label>
                                <textarea class="form-control" rows="3" data-section="viaAerea"></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Respiração -->
                <section id="respiracao" class="mb-4">
                    <h3>B - Respiração</h3>
                    <div class="card">
                        <div class="card-body">
                            <div id="respiracaoChecklist"></div>
                            <div class="mt-3">
                                <label class="form-label">Notas:</label>
                                <textarea class="form-control" rows="3" data-section="respiracao"></textarea>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Circulação -->
                <section id="circulacao" class="mb-4">
                    <h3>C - Circulação</h3>
                    <div class="card">
                        <div class="card-body">
                            <div id="circulacaoChecklist"></div>
                            <div class="mt-3">
                                <label class="form-label">Notas:</label>
                                <textarea class="form-control" rows="3" data-section="circulacao"></textarea>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Modal de Alertas -->
    <div class="modal fade" id="alertaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Alerta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="alertaConteudo"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/protocolo.js') }}"></script>
</body>
</html>
